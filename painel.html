<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro</title>
    <style>
        /* MANTIVE SEU CSS INTACTO - ELE ESTÁ ÓTIMO */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #1a1a1a;
            margin: 0 auto;
            padding: 20px;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        div[style*="border"],
        #vitrine-ofertas div,
        #lista-reservas div {
            background: #ffffff;
            border: none !important;
            border-radius: 12px !important;
            padding: 20px !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px !important;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #fafafa;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        button:active {
            background-color: #333333;
            transform: scale(0.98);
        }

        hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 30px 0;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <header>
        <h1>Painel de Controle</h1>
        <p>Publicar nova vaga no Radar</p>
    </header>

    <main>
        <form id="form-oferta" onsubmit="event.preventDefault(); publicarOferta();">
            
            <!-- NOVO: Seleção do Serviço -->
            <label for="servico">Serviço Ocioso:</label><br>
            <select id="servico" required>
                <option value="Corte Degradê + Barba">Corte Degradê + Barba</option>
                <option value="Corte Simples (Máquina)">Corte Simples (Máquina)</option>
                <option value="Sobrancelha + Acabamento">Sobrancelha + Acabamento</option>
            </select><br><br>

            <label for="preco-original">Preço Normal (R$):</label><br>
            <input type="number" id="preco-original" step="0.01" required><br><br>

            <label for="preco-desconto">Preço Promocional (R$):</label><br>
            <input type="number" id="preco-desconto" step="0.01" required><br><br>

            <!-- NOVO: Quantidade de vagas disponíveis -->
            <label for="vagas">Quantas vagas disponíveis?</label><br>
            <input type="number" id="vagas" min="1" max="10" value="1" required><br><br>

            <button id="btn-submit" type="submit">Ativar Oferta no Site</button>
        </form>
    </main>
    <hr>
    <h2>Reservas Recebidas</h2>
    <div id="lista-reservas">Buscando reservas...</div>

    <script>
        // Mantive as suas credenciais reais do Supabase
        const supabaseUrl = 'https://bljuwqitgsppnnvoyfsg.supabase.co';
        const supabaseKey = 'sb_publishable_bgy8n7b1Cb7T0PrMfsWF2A_93H3nD1m';
        const cliente = window.supabase.createClient(supabaseUrl, supabaseKey);

        const idDaBarbearia = '409f5bf0-5606-4ec7-becf-c7b38f66183b';

        async function publicarOferta() {
            const btn = document.getElementById('btn-submit');
            btn.innerText = "Publicando...";
            btn.disabled = true;

            const servico = document.getElementById('servico').value;
            const precoOriginal = parseFloat(document.getElementById('preco-original').value);
            const precoDesconto = parseFloat(document.getElementById('preco-desconto').value);
            const vagas = parseInt(document.getElementById('vagas').value);

            // Alinhado com o schema exato que o index.html vai consumir
            const { error } = await cliente
                .from('ofertas')
                .insert([
                    {
                        barbearia_id: idDaBarbearia,
                        servico: servico,
                        preco_original: precoOriginal,
                        preco_desconto: precoDesconto,
                        vagas: vagas,
                        status: 'ativa',
                        link_pagamento: 'https://mpago.la/11BELme' // O seu link do Mercado Pago entra automaticamente aqui
                    }
                ]);

            if (error) {
                console.error("Erro ao gravar:", error);
                alert("Erro ao publicar a oferta. Verifique o banco de dados.");
            } else {
                alert("Sucesso! A vaga já está visível para os clientes no Radar.");
                document.getElementById('form-oferta').reset();
            }
            
            btn.innerText = "Ativar Oferta no Site";
            btn.disabled = false;
        }

        async function carregarReservas() {
            const divReservas = document.getElementById('lista-reservas');

            const { data: reservas, error } = await cliente
                .from('reservas')
                .select('*')
                .order('created_at', { ascending: false }); // Traz as mais recentes primeiro

            if (error) {
                divReservas.innerHTML = "Erro ao carregar reservas.";
                return;
            }

            if (reservas.length === 0) {
                divReservas.innerHTML = "<p style='text-align:center; color:#666;'>Nenhuma reserva aprovada ainda.</p>";
                return;
            }

            divReservas.innerHTML = ''; 

            reservas.forEach(reserva => {
                const cartao = document.createElement('div');
                cartao.innerHTML = `
                    <p style="margin: 0 0 8px 0; color: #10b981; font-weight: bold;">💰 Pago</p>
                    <p style="margin: 4px 0;"><strong>Voucher:</strong> ${reserva.codigo_voucher}</p>
                    <p style="margin: 4px 0;"><strong>Cliente:</strong> ${reserva.telefone_cliente}</p>
                `;
                divReservas.appendChild(cartao);
            });
        }

        carregarReservas();
    </script>
</body>

</html>
