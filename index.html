<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Ofertas | Barbearia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header class="hero">
            <h1>Descontos de última hora perto de você.</h1>
            <p>Garanta seu Passe VIP e corte sem fila de espera hoje.</p>
        </header>

        <div class="offers-container" id="vitrine-ofertas"></div>
    </div>

    <!-- Importação do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Importação do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://bljuwqitgsppnnvoyfsg.supabase.co';
        const supabaseKey = 'sb_publishable_bgy8n7b1Cb7T0PrMfsWF2A_93H3nD1m';
        
        // CORREÇÃO: Variável renomeada para clienteSupabase para evitar conflito no Safari
        const clienteSupabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function carregarOfertas() {
            const vitrine = document.getElementById('vitrine-ofertas');
            
            // Usando a nova variável aqui
            const { data: ofertas, error } = await clienteSupabase
                .from('ofertas')
                .select('*')
                .eq('status', 'ativa')
                .gt('vagas', 0); 

            if (error) {
                console.error('Erro ao buscar ofertas:', error);
                vitrine.innerHTML = '<p>Erro ao carregar o sistema.</p>';
                return;
            }

            if (ofertas.length === 0) {
                vitrine.innerHTML = '<p style="text-align: center; color: #888;">Nenhuma vaga VIP disponível neste exato momento. Volte em breve!</p>';
                return;
            }

            vitrine.innerHTML = ''; 

            // Injeta os cartões com os dados reais do banco
            ofertas.forEach(oferta => {
                const cartao = `
                    <div class="offer-card">
                        <div class="badge">🔥 SÓ ${oferta.vagas} VAGA(S) HOJE</div>
                        <h3>${oferta.servico}</h3>
                        <div class="price-container">
                            <span class="old-price">R$ ${oferta.preco_original.toFixed(2).replace('.', ',')}</span>
                            <span class="new-price">R$ ${oferta.preco_desconto.toFixed(2).replace('.', ',')}</span>
                        </div>
                        <button class="btn-reserve" onclick="window.location.href='${oferta.link_pagamento}'">Garantir Passe VIP</button>
                    </div>
                `;
                vitrine.innerHTML += cartao;
            });
        }

        // Dispara a função automaticamente quando a página carrega
        window.onload = carregarOfertas;
    </script>

</body>
</html>
